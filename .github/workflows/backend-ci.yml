name: Backend CI (FastAPI & OIML Metrology Core)

on:
  push:
    branches: [ main, staging, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, staging, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-metrology-tests:
    name: OIML R 76 Metrology Engine & API Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies (Pango, Cairo, HarfBuzz for WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libpango1.0-dev \
            libffi-dev \
            shared-mime-info \
            libjpeg-dev \
            libopenjp2-7-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Metrology Unit & Compliance Test Suite
        run: |
          pytest tests/ -v --tb=short
